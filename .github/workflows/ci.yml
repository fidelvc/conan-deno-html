name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno ci
        run: deno ci

      - name: deno fmt --check
        run: deno fmt --check

      - name: deno lint
        run: deno lint

      - name: deno check
        run: deno task check

      # Los tests de los ejercicios están en rojo a propósito: son tu lista de
      # pendientes, no un fallo de la infraestructura. Descomenta este paso
      # cuando termines la serie entera.
      #
      # - name: deno test
      #   run: deno task test
